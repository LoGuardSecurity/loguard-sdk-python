name: AI contract regression
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ai-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LOGUARD_API_KEY: ''
  LOGGUARD_API_KEY: ''
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_sdk.py tests/test_ai_contract_privacy.py -k 'not TestLive' -q
