[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loguard"]

[project]
name = "loguard"
dynamic = ["version"]
description = "Official Python SDK for LoGuard security monitoring and threat detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "monitoring", "threat-detection", "sdk"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
]

dependencies = [
    "httpx>=0.27.2",
]

[project.optional-dependencies]
fastapi = [
    "starlette>=0.27.0",
]

django = [
    "django>=3.2",
    "asgiref>=3.7",
]

dev = [
    "pytest>=7",
    "pytest-asyncio",
    "respx",
    "httpx",
]

[project.urls]
Homepage = "https://loguard.org"
Repository = "https://github.com/LoGuardSecurity/loguard-sdk-python"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "integration: explicit live-service checks requiring configured credentials and endpoint",
]

[tool.hatch.version]
path = "loguard/_version.py"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
